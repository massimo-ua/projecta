server {
    listen 80;
    server_name localhost;

    # Cross-Origin-Opener-Policy header to allow Google OAuth popups (window.closed access)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Maximum allowed payload size
    client_max_body_size 20M;

    # Reverse proxy for backend Go API endpoints
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle /api endpoint redirect
    location = /api {
        return 308 /api/;
    }

    # Reverse proxy for React + Vite Frontend UI (including HMR WebSockets)
    location / {
        proxy_pass http://web-ui:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

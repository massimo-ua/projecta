include:
  - ./infra.docker-compose.local.yaml

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: projecta_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - web-ui

  migrate:
    build:
      context: ../.
      dockerfile: ./docker/migrate.dockerfile
    environment:
      - DB_URI=postgres://projecta:projecta@projecta_db:5432/projecta?sslmode=disable
      - MIGRATION_PATH=migrations
    depends_on:
      projecta_db:
        condition: service_healthy

  web:
    build:
      context: ../.
      dockerfile: ./docker/web.dockerfile
    restart: always
    environment:
      - DB_URI=postgres://projecta:projecta@projecta_db:5432/projecta?sslmode=disable
      - AMQP_URI=amqp://projecta:projecta@projecta_amqp:5672
      - HTTP_URI=0.0.0.0:8000
      - JWT_SECRET=dev_jwt_secret_key
      - GOOGLE_CLIENT_ID=871272346015-ubr29kl8rdib8njh66sanhfl9ffikhml.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here
    depends_on:
      projecta_db:
        condition: service_healthy
      projecta_amqp:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"

  web-ui:
    build:
      context: ../.
      dockerfile: ./docker/web-ui.dockerfile
    restart: always
    environment:
      - VITE_API_TARGET=http://web:8000
    ports:
      - "5173:5173"
    volumes:
      - ../web-ui:/app
      - /app/node_modules
    depends_on:
      - web
